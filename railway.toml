# Ana uygulama servisi: giderlerim (tek konteyner: Next.js $PORT + Spring Boot 127.0.0.1:8081)
# Çalışma zamanı değişkenleri: DATABASE_URL (=${{Postgres.DATABASE_URL}}), JWT_SECRET, OPENAI_API_KEY,
#   ALLOWED_ORIGIN, APP_PUBLIC_URL, SHOPIER_* — ayrıntı: .env.example
# Build değişkenleri: NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_SHOPIER_*

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Healthcheck Next rewrite üzerinden Spring'e gider; ikisi de ayakta değilse deploy başarısız sayılır.
healthcheckPath = "/api/v1/actuator/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
