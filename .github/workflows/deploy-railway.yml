name: Deploy to Railway

on:
  push:
    branches:
      - master

# Aynı anda tek deploy; yeni push gelirse sıradaki bekler, çalışan deploy iptal edilmez.
concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  dogrulama:
    name: Doğrulama (build, test, migration)
    uses: ./.github/workflows/pr-validation.yml

  deploy:
    name: Railway Deploy
    needs: dogrulama
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Railway CLI kur
        run: npm install -g @railway/cli

      - name: Railway'e deploy et
        run: railway up --detach --service giderlerim
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
