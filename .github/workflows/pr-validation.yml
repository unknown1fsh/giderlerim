name: PR Validation

on:
  pull_request:
    branches:
      - master
  # Deploy workflow'u aynı doğrulamayı yeniden kullanır; doğrulama geçmeden deploy başlamaz.
  workflow_call:

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: giderlerim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # FlywayMigrasyonDogrulamaTest: tüm migration'ları boş şemaya uygular ve ddl-auto=validate ile entity eşlemesini doğrular.
      MIGRASYON_TEST_DB_URL: jdbc:postgresql://localhost:5432/giderlerim_test?stringtype=unspecified
      MIGRASYON_TEST_DB_USER: postgres
      MIGRASYON_TEST_DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build, test ve migration doğrulaması
        run: mvn -f backend/pom.xml --no-transfer-progress verify

  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: Lint
        run: npm run lint --workspace giderlerim-web

      - name: Build
        run: npm run build --workspace giderlerim-web
